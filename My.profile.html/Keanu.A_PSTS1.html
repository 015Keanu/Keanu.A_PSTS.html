<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Creatif Festival</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-8">
    
    <header class="bg-gradient-to-r from-red-600 to-blue-800 text-white p-8 rounded-lg shadow-md text-center">
      <p class="text-sm uppercase tracking-wider font-semibold opacity-90">SMA ABBS BOYOLALI</p>
      <h1 class="text-3xl md:text-4xl font-bold my-2">Festival Creatifity </h1>
      <p class="text-base md:text-lg font-light opacity-95"></p>
    </header>


    <main class="bg-white p-6 md:p-8 rounded-lg shadow-md">
      <h2 class="text-2xl font-bold text-gray-800 border-b pb-3 mb-6">Formulir Pendaftaran</h2>
      
      <form class="space-y-5" action="#" method="POST">
        
        <div>
          <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Siswa</label>
          <input type="text" id="nama" name="nama" placeholder="Enter your full name" class="w-full border border-gray-300 rounded-md px-3 py-2-red-500">
        </div>

        <div>
          <label for="kelas" class="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
          <select id="kelas" name="kelas" class="w-full border border-gray-300 rounded-md px-3 py-2 bg-white red-500">
            <option value="" disabled selected>Pilih Kelas</option>
            <option value="X">X</option>
            <option value="XI">XI</option>
            <option value="XII">XII</option>
          </select>
        </div>

        <div>
          <span class="block text-sm font-medium text-gray-700 mb-1">Jenis Kelamin</span>
          <div class="flex items-center space-x-6">
            <label class="inline-flex items-center cursor-pointer">
              <input type="radio" name="jenis_kelamin" value="Pria" class="text-red-600 focus:ring-red-500">
              <span class="ml-2 text-gray-700">Pria</span>
            </label>
            <label class="inline-flex items-center cursor-pointer">
              <input type="radio" name="jenis_kelamin" value="Wanita" class="text-red-600 focus:ring-red-500">
              <span class="ml-2 text-gray-700">Wanita</span>
            </label>
          </div>
        </div>

       
        <div>
          <label for="kategori" class="block text-sm font-medium text-gray-700 mb-1">Kategori Kompetisi</label>
          <select id="kategori" name="kategori" class="w-full border border-gray-300 rounded-md px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-500">
            <option value="" disabled selected>Pilih Kategori</option>
            <option value="makan kerupuk">makan kerupuk</option>
            <option value="kelereng">kelereng</option>
            <option value="balap karung">balap karung</option>
            <option value="tarik tambanng">tarik tambang</option>
            
          </select>
        </div>

    
        <div>
          <span class="block text-sm font-medium text-gray-700 mb-1">Tipe Partisipasi</span>
          <div class="flex items-center space-x-6">
            <label class="inline-flex items-center cursor-pointer">
              <input type="radio" name="tipe_partisipasi" value="Individu" class="text-red-600 focus:ring-red-500">
              <span class="ml-2 text-gray-700">Individu</span>
            </label>
            <label class="inline-flex items-center cursor-pointer">
              <input type="radio" name="tipe_partisipasi" value="Tim" class="text-red-600 focus:ring-red-500">
              <span class="ml-2 text-gray-700">Tim</span>
            </label>
          </div>
        </div>

    
        <div>
          <label for="nama_tim" class="block text-sm font-medium text-gray-700 mb-1">Nama Tim</label>
          <input type="text" id="nama_tim" name="nama_tim" placeholder="Enter your team's name" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        
        <div>
          <label for="kontak" class="block text-sm font-medium text-gray-700 mb-1">Nomor Kontak</label>
          <input type="tel" id="kontak" name="kontak" placeholder="805K34N705" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        
        <div>
          <label for="deskripsi" class="block text-sm font-medium text-gray-700 mb-1">Deskripsi Proyek</label>
          <textarea id="deskripsi" name="deskripsi" rows="4" placeholder="Describe your project or competition entry..." class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500"></textarea>
        </div>

        
        <div>
          <button type="submit" class="bg-red-700 hover:bg-red-800 text-white font-semibold py-2.5 px-6 rounded-md shadow transition duration-200">
            Daftar Sekarang
          </button>
        </div>
        <div class="bg-gradient-to-t from-blue-500 to-blue-400 rounded-xl p-4 shadow-2xl mx-auto text-blue-900 overflow-x-auto">
                <table class="w-full border border-red-800 rounded table-auto text-center">
                    <thead>
                        <tr class="bg-red-800 text-white">
                            <th class="p-3 border border-red-950">No</th>
                            <th class="p-3 border border-red-950">joko</th>/th>
                            <th class="p-3 border border-red-950">XI</th>
                            <th class="p-3 border border-red-950">web devolepment</th>
                            <th class="p-3 border border-red-950">abbs team<aa/th>
                            <th class="p-3 border border-red-950">padding</th>
                        </tr>
                    </thead>
                     <thead>
                        <tr class="bg-red-800 text-white">
                            <th class="p-3 border border-red-950">No</th>
                            <th class="p-3 border border-red-950">keanu</th>
                            <th class="p-3 border border-red-950">x</th>
                            <th class="p-3 border border-red-950">progamming</th>
                            <th class="p-3 border border-red-950">abbs team</th>
                            <th class="p-3 border border-red-950">padding</th>
                        </tr>
                    </thead>
